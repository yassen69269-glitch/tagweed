<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم - استماع وتكرار واختبار</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { font-family: Tahoma, Arial, sans-serif; background: #f4f1ea; margin: 0; color: #222; }
  header { background: #1e5b4f; color: #fff; padding: 14px; text-align: center; }
  header h1 { margin: 0; font-size: 26px; }
  .wrap { max-width: 900px; margin: auto; padding: 12px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  select, button, input { font-size: 16px; padding: 8px 12px; border-radius: 8px; border: 1px solid #bbb; }
  button { background: #1e5b4f; color: #fff; border: none; cursor: pointer; }
  button:hover { opacity: .9; }
  button.sec { background: #e0e0e0; color: #222; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ayah { font-family: "Amiri", "Traditional Arabic", serif; font-size: 26px; line-height: 2.2; padding: 4px 8px; border-radius: 8px; cursor: pointer; }
  .ayah.active { background: #ffe9a8; }
  .num { color: #1e5b4f; font-size: 18px; margin: 0 6px; }
  .opt { display: block; width: 100%; text-align: right; margin: 6px 0; background: #eef5f3; color: #222; font-family: "Amiri", serif; font-size: 22px; line-height: 1.8; }
  .ok { background: #b7e4b0 !important; }
  .bad { background: #f5b7b1 !important; }
  .qtext { font-size: 20px; margin-bottom: 8px; }
  #status { color: #555; font-size: 14px; }
</style>
</head>
<body>
<header><h1>القرآن الكريم</h1></header>

<div class="wrap">
  <div class="card row">
    <label>السورة: <select id="surahSel"></select></label>
    <label>القارئ:
      <select id="reciterSel">
        <option value="Husary_128kbps">محمود خليل الحصري</option>
        <option value="Minshawy_Murattal_128kbps">محمد صديق المنشاوي (مرتل)</option>
        <option value="Minshawy_Mujawwad_192kbps">محمد صديق المنشاوي (مجود)</option>
        <option value="Abdul_Basit_Murattal_192kbps">عبد الباسط عبد الصمد (مرتل)</option>
        <option value="Abdul_Basit_Mujawwad_128kbps">عبد الباسط عبد الصمد (مجود)</option>
      </select>
    </label>
    <label>التكرار:
      <select id="repeatSel">
        <option value="0">بدون تكرار</option>
        <option value="1">مرة إضافية</option>
        <option value="2">مرتان إضافيتان</option>
        <option value="4">4 مرات إضافية</option>
        <option value="9">9 مرات إضافية</option>
        <option value="Infinity">تكرار مستمر</option>
      </select>
    </label>
    <label><input type="checkbox" id="playAllChk" checked> تشغيل متتابع</label>
    <label><input type="checkbox" id="repeatSurahChk"> تكرار السورة</label>
  </div>

  <div class="card row">
    <button id="tabRead">الاستماع والقراءة</button>
    <button id="tabQuiz" class="sec">الاختبار الصوتي</button>
  </div>

  <div id="readView" class="card">
    <div class="row">
      <button id="prevBtn" class="sec">السابقة</button>
      <button id="playBtn">تشغيل</button>
      <button id="nextBtn" class="sec">التالية</button>
      <button id="stopBtn" class="sec">إيقاف</button>
      <span id="status"></span>
    </div>
    <div id="ayahsDiv" style="margin-top:12px"></div>
  </div>

  <div id="quizView" class="card" style="display:none">
    <div class="row">
      <button id="newQ">سؤال جديد</button>
      <button id="replayQ" class="sec">إعادة الاستماع</button>
      <span id="score">النتيجة: 0 من 0</span>
    </div>
    <div id="qArea" style="margin-top:12px"></div>
  </div>
</div>

<script>
const API = "https://api.alquran.cloud/v1";
const surahSel = document.getElementById("surahSel");
const reciterSel = document.getElementById("reciterSel");
const repeatSel = document.getElementById("repeatSel");
const playAllChk = document.getElementById("playAllChk");
const repeatSurahChk = document.getElementById("repeatSurahChk");
const ayahsDiv = document.getElementById("ayahsDiv");
const statusEl = document.getElementById("status");
const playBtn = document.getElementById("playBtn");
const qArea = document.getElementById("qArea");
const scoreEl = document.getElementById("score");

const audio = new Audio();
let ayahs = [];
let cur = 0;
let remaining = 0;
let playing = false;
let quizMode = false;
let quizIdx = -1;
let score = 0;
let total = 0;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function audioUrl(i) {
  const s = String(surahSel.value).padStart(3, "0");
  const a = String(ayahs[i].numberInSurah).padStart(3, "0");
  return `https://everyayah.com/data/${reciterSel.value}/${s}${a}.mp3`;
}

async function init() {
  const r = await fetch(`${API}/surah`);
  const d = await r.json();
  d.data.forEach(s => {
    const o = document.createElement("option");
    o.value = s.number;
    o.textContent = `${s.number}. ${s.name}`;
    surahSel.appendChild(o);
  });
  surahSel.value = 1;
  await loadSurah(1);
}

async function loadSurah(n) {
  stopAudio();
  statusEl.textContent = "جارٍ التحميل...";
  try {
    const r = await fetch(`${API}/surah/${n}/quran-uthmani`);
    const d = await r.json();
    ayahs = d.data.ayahs;
    cur = 0;
    renderAyahs();
    statusEl.textContent = "";
  } catch (e) {
    statusEl.textContent = "تعذر تحميل السورة، تحقق من الاتصال بالإنترنت.";
  }
}

function renderAyahs() {
  ayahsDiv.innerHTML = "";
  ayahs.forEach((a, i) => {
    const s = document.createElement("span");
    s.className = "ayah";
    s.dataset.i = i;
    s.textContent = a.text;
    const n = document.createElement("span");
    n.className = "num";
    n.textContent = "﴿" + a.numberInSurah + "﴾";
    s.appendChild(n);
    s.onclick = () => playAyah(i);
    ayahsDiv.appendChild(s);
    ayahsDiv.appendChild(document.createTextNode(" "));
  });
  highlight();
}

function highlight() {
  document.querySelectorAll(".ayah").forEach(e => {
    e.classList.toggle("active", +e.dataset.i === cur);
  });
  const el = document.querySelector(".ayah.active");
  if (el && playing) el.scrollIntoView({ block: "center", behavior: "smooth" });
}

function playAyah(i) {
  quizMode = false;
  cur = i;
  remaining = +repeatSel.value;
  startCurrent();
}

function startCurrent() {
  audio.src = audioUrl(cur);
  audio.play();
  playing = true;
  playBtn.textContent = "إيقاف مؤقت";
  statusEl.textContent = `الآية ${ayahs[cur].numberInSurah} - ${reciterSel.options[reciterSel.selectedIndex].text}`;
  highlight();
}

function stopAudio() {
  audio.pause();
  playing = false;
  playBtn.textContent = "تشغيل";
}

audio.onended = () => {
  if (quizMode) return;
  if (remaining === Infinity || remaining > 0) {
    if (remaining !== Infinity) remaining--;
    audio.currentTime = 0;
    audio.play();
    return;
  }
  if (playAllChk.checked) {
    if (cur < ayahs.length - 1) {
      playAyah(cur + 1);
    } else if (repeatSurahChk.checked) {
      playAyah(0);
    } else {
      stopAudio();
    }
  } else {
    stopAudio();
  }
};

audio.onerror = () => {
  if (!quizMode) statusEl.textContent = "تعذر تحميل الصوت لهذا القارئ أو هذه الآية.";
};

playBtn.onclick = () => {
  if (audio.paused) {
    if (!audio.src) {
      playAyah(cur);
    } else {
      audio.play();
      playing = true;
      playBtn.textContent = "إيقاف مؤقت";
    }
  } else {
    audio.pause();
    playBtn.textContent = "تشغيل";
  }
};

document.getElementById("stopBtn").onclick = stopAudio;
document.getElementById("nextBtn").onclick = () => { if (cur < ayahs.length - 1) playAyah(cur + 1); };
document.getElementById("prevBtn").onclick = () => { if (cur > 0) playAyah(cur - 1); };
surahSel.onchange = () => loadSurah(+surahSel.value);
reciterSel.onchange = () => { if (playing && !quizMode) startCurrent(); };

// ---------- الاختبار الصوتي ----------
function showView(which) {
  const isRead = which === "read";
  document.getElementById("readView").style.display = isRead ? "block" : "none";
  document.getElementById("quizView").style.display = isRead ? "none" : "block";
}

document.getElementById("tabRead").onclick = () => {
  quizMode = false;
  stopAudio();
  showView("read");
};

document.getElementById("tabQuiz").onclick = () => {
  stopAudio();
  showView("quiz");
  newQuestion();
};

function updateScore() {
  scoreEl.textContent = `النتيجة: ${score} من ${total}`;
}

function newQuestion() {
  qArea.innerHTML = "";
  if (ayahs.length < 4) {
    qArea.textContent = "اختر سورة بها 4 آيات على الأقل لبدء الاختبار.";
    return;
  }
  quizMode = true;
  remaining = 0;
  quizIdx = Math.floor(Math.random() * ayahs.length);

  const pool = ayahs.map((_, i) => i).filter(i => i !== quizIdx);
  const wrong = shuffle(pool).slice(0, 3);
  const options = shuffle([quizIdx, ...wrong]);

  const q = document.createElement("div");
  q.className = "qtext";
  q.textContent = "استمع إلى الآية، ثم اختر نصها الصحيح:";
  qArea.appendChild(q);

  const info = document.createElement("div");
  info.id = "qInfo";
  info.style.color = "#555";
  qArea.appendChild(info);

  options.forEach(i => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = ayahs[i].text;
    b.dataset.i = i;
    b.onclick = () => answer(b, i);
    qArea.appendChild(b);
  });

  audio.src = audioUrl(quizIdx);
  audio.play();
  playing = true;
  playBtn.textContent = "تشغيل";
}

function answer(btn, i) {
  const buttons = qArea.querySelectorAll(".opt");
  if (buttons[0].disabled) return;
  buttons.forEach(b => b.disabled = true);
  total++;
  if (i === quizIdx) {
    score++;
    btn.classList.add("ok");
    document.getElementById("qInfo").textContent = "إجابة صحيحة! ✔";
  } else {
    btn.classList.add("bad");
    buttons.forEach(b => { if (+b.dataset.i === quizIdx) b.classList.add("ok"); });
    document.getElementById("qInfo").textContent = `إجابة خاطئة. الآية الصحيحة هي رقم ${ayahs[quizIdx].numberInSurah}.`;
  }
  updateScore();
}

document.getElementById("newQ").onclick = newQuestion;
document.getElementById("replayQ").onclick = () => {
  if (quizIdx < 0) return;
  audio.src = audioUrl(quizIdx);
  audio.play();
};

init();
</script>
</body>
</html>
